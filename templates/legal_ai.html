{% extends 'base.html' %}
{% block title %}Legal AI{% endblock %}
{% block content %}
    <h1>Legal AI - Upload Images</h1>
    <div class="legal-ai-container">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="imageInput" name="images" multiple>
            <button type="submit">Upload</button>
        </form>
        <div id="responseSection" style="display:none;">
            <textarea id="context" readonly></textarea>
            <div class="question-input-row">
                <input type="text" id="question" placeholder="Ask a question..." />
                <button onclick="askQuestion()" class="action-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
                <button onclick="startVoiceInput()" class="action-btn voice-btn" id="voiceBtn">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
            <div id="answer"></div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script src="{{ url_for('static', filename='legal_ai.js') }}"></script>
{% endblock %}
